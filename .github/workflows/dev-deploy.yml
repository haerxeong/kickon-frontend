name: Deploy to AWS

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 코드
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          
      - name: 🔹 .env 파일 생성
        run: |
          echo "VITE_BASE_URL=https://api-dev.kickon.net" >> .env
          echo "VITE_API_PREDICT_URL=https://w7ufflahpf.execute-api.ap-northeast-2.amazonaws.com" >> .env

      - name: 의존성 설치 및 빌드
        run: |
          yarn install
          yarn build
      - name: 파일 압축
        run: |
          zip -r build.zip dist

      - name: S3에 업로드
        run: aws s3 cp dist s3://dev.kickon.net/ --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
